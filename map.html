<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIS Map & Hotspots - Smart Road AI System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    .map-page-grid {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 1.5rem;
    }
    #gis-map {
      width: 100%;
      height: 650px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-accent);
      box-shadow: var(--shadow-glow);
    }
    .hotspot-card {
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1rem;
      transition: var(--transition-fast);
    }
    .hotspot-card:hover {
      border-color: var(--status-high);
      background: rgba(31, 41, 55, 0.9);
    }
    .hotspot-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--status-critical);
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-body">

        <div class="map-page-grid">
          <!-- GIS Interactive Leaflet Map -->
          <div class="card" style="padding:0.75rem;">
            <div id="gis-map"></div>
          </div>

          <!-- Hotspot Clusters Sidebar -->
          <div class="card" style="overflow-y:auto; max-height:670px;">
            <div class="card-header">
              <span class="card-title">🔥 Pothole Hotspot Clusters</span>
            </div>
            <div id="hotspot-list-container">
              Loading hotspot clusters...
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
