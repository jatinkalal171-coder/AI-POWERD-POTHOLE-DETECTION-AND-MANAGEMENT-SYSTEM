<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Smart Road AI System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.18), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.18), transparent 45%),
                  var(--bg-primary);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.25rem;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-brand img {
      height: 48px;
      margin-bottom: 0.5rem;
    }
    .auth-tabs {
      display: flex;
      background: rgba(31, 41, 55, 0.6);
      padding: 0.25rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.6rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-fast);
    }
    .form-control:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }
    .btn-block {
      width: 100%;
      justify-content: center;
      padding: 0.85rem;
      margin-top: 1rem;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .demo-users {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
    }
    .demo-users p {
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .demo-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .demo-chip {
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
    }
    .demo-chip:hover {
      border-color: var(--accent-cyan);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand" style="text-align:center;">
      <img src="images/logo.png" style="max-height:160px; width:auto; max-width:100%; object-fit:contain; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.6)); margin-bottom:0.5rem;" alt="ROADFIX Logo">
    </div>

    <!-- Auth Mode Switcher Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
      <div class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Create Account (Sign Up)</div>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="officer@city.gov" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Sign In to Portal 🚀
      </button>
    </form>

    <!-- SIGNUP / REGISTER FORM -->
    <form id="signup-form" style="display:none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" class="form-control" placeholder="user@city.gov" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label>Select User Role</label>
        <select id="reg-role" class="form-control" required>
          <option value="Citizen">👤 Citizen (Report Potholes & View Status)</option>
          <option value="Municipality Officer">🏛️ Municipality Officer (Manage & Assign Work Orders)</option>
          <option value="Field Officer">🛠️ Field Officer (Execute & Verify Repairs)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="background:linear-gradient(135deg, #10b981, #06b6d4);">
        Register & Create Account ✨
      </button>
    </form>

    <div class="demo-users" id="demo-box">
      <p>Quick Demo Fill Credentials:</p>
      <div class="demo-btn-group">
        <button type="button" class="demo-chip" onclick="quickFill('admin@city.gov', 'admin123')">👑 Admin</button>
        <button type="button" class="demo-chip" onclick="quickFill('officer@city.gov', 'officer123')">🏛️ Officer</button>
        <button type="button" class="demo-chip" onclick="quickFill('field07@city.gov', 'field123')">🛠️ Field Officer</button>
        <button type="button" class="demo-chip" onclick="quickFill('citizen@gmail.com', 'citizen123')">👤 Citizen</button>
      </div>
    </div>

    <div style="text-align:center; margin-top:1.5rem; padding-top:1rem; border-top:1px solid rgba(255,255,255,0.08); font-size:0.75rem; color:var(--text-muted); font-weight:600; letter-spacing:0.04em;">
      Made with ❤️ by <span style="color:var(--accent-cyan); font-weight:700;">Jatin</span>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function switchAuthTab(mode) {
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const demoBox = document.getElementById('demo-box');

      if (mode === 'signup') {
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
        signupForm.style.display = 'block';
        loginForm.style.display = 'none';
        demoBox.style.display = 'none';
      } else {
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        demoBox.style.display = 'block';
      }
    }

    function quickFill(email, pwd) {
      switchAuthTab('login');
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pwd;
    }

    // Login Handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        if (res && res.token) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          showToast(`Welcome back, ${res.user.name} (${res.user.role})!`, 'success');
          setTimeout(() => redirectUserByRole(res.user.role), 400);
        }
      } catch (err) {
        console.error('Login error:', err);
      }
    });

    // Register / Signup Handler
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const role = document.getElementById('reg-role').value;

      try {
        const res = await apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, role })
        });

        if (res && res.token) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          showToast(`Account registered successfully as ${res.user.role}!`, 'success');
          setTimeout(() => redirectUserByRole(res.user.role), 400);
        }
      } catch (err) {
        console.error('Register error:', err);
      }
    });
  </script>
</body>
</html>
