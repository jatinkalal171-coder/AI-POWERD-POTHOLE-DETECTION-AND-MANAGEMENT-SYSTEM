<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Analytics - Smart Road AI System</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .chart-box {
      position: relative;
      height: 280px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-body">

        <!-- Analytics Charts Grid -->
        <div class="analytics-grid">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Pothole Detections Over Time</span>
            </div>
            <div class="chart-box">
              <canvas id="trendChart"></canvas>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span class="card-title">Risk Level Breakdown</span>
            </div>
            <div class="chart-box">
              <canvas id="riskChart"></canvas>
            </div>
          </div>
        </div>

        <div class="analytics-grid">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Most Damaged Road Segments</span>
            </div>
            <div class="chart-box">
              <canvas id="roadChart"></canvas>
            </div>
          </div>

          <!-- Predictive Maintenance Module -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">🔮 Predictive Maintenance Risk Module</span>
            </div>
            <div id="predictive-rankings-box">
              Loading predictive risk assessment...
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
