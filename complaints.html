<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Complaints - Smart Road AI System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .complaint-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap: 1.5rem;
    }
    .gps-btn {
      width: 100%;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.65rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition-fast);
      margin-bottom: 0.75rem;
    }
    .gps-btn:hover {
      background: var(--accent-blue);
      color: #fff;
    }
    #cmp-map {
      width: 100%;
      height: 220px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-top: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .gps-status {
      font-size: 0.8rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-body">

        <div class="complaint-grid">
          <!-- Submit Complaint Form -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">Submit Road Damage Complaint</span>
            </div>

            <form id="complaint-form">
              <div class="form-group">
                <label>Reporter Name</label>
                <input type="text" id="cmp-name" class="form-control" value="John Citizen" required>
              </div>

              <div class="form-group">
                <label>Reporter Email</label>
                <input type="email" id="cmp-email" class="form-control" value="citizen@gmail.com" required>
              </div>

              <div class="form-group">
                <label>Location / Road Name</label>
                <input type="text" id="cmp-location" class="form-control" placeholder="e.g., Main Street Near Sector 4 Market" required>
              </div>

              <!-- GPS Real Location Section -->
              <div class="form-group">
                <label>Pothole GPS Location</label>
                
                <button type="button" class="gps-btn" id="use-location-btn" onclick="fetchRealGPSLocation()">
                  📍 USE MY CURRENT LOCATION
                </button>

                <div id="gps-status-box" class="gps-status" style="display:none;"></div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:0.5rem;">
                  <div>
                    <label style="font-size:0.75rem; color:var(--text-muted);">Latitude</label>
                    <input type="number" step="any" id="cmp-lat" class="form-control" placeholder="Latitude" required>
                  </div>
                  <div>
                    <label style="font-size:0.75rem; color:var(--text-muted);">Longitude</label>
                    <input type="number" step="any" id="cmp-lng" class="form-control" placeholder="Longitude" required>
                  </div>
                </div>

                <div id="cmp-map"></div>
              </div>

              <div class="form-group">
                <label>Description of Road Hazard</label>
                <textarea id="cmp-desc" class="form-control" rows="2" placeholder="Describe the size and hazard to vehicles..." required></textarea>
              </div>

              <div class="form-group">
                <label>Upload Pothole Photo</label>
                <input type="file" id="cmp-file" class="form-control" accept="image/*" required>
              </div>

              <button type="submit" class="btn btn-primary btn-block" id="cmp-btn">
                Submit & Run AI Verification 🚀
              </button>
            </form>

            <div id="cmp-result-box" style="display:none; margin-top:1.25rem; padding:1rem; background:rgba(16,185,129,0.15); border:1px solid var(--status-good); border-radius:var(--radius-md); font-size:0.85rem;">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Complaint Registry List -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">Citizen Complaints Registry</span>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Complaint ID</th>
                    <th>Pothole ID</th>
                    <th>Location</th>
                    <th>Submitted By</th>
                    <th>Date</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="complaints-tbody">
                  <tr><td colspan="6" style="text-align:center; padding:2rem;">Loading complaints...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/complaints.js"></script>
</body>
</html>
