<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Smart Road AI System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notif-item {
      padding: 1.2rem;
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition-fast);
    }
    .notif-item.unread {
      border-color: var(--border-accent);
      background: rgba(59, 130, 246, 0.08);
    }
  </style>
</head>
<body>

  <div id="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="content-body">

        <div class="card">
          <div class="card-header">
            <span class="card-title">In-App Alerts & Escalation Notifications</span>
            <button class="btn btn-secondary" onclick="markAllNotificationsRead()" style="padding:0.4rem 0.8rem; font-size:0.75rem;">Mark All Read ✅</button>
          </div>

          <div id="notifications-list-box">
            Loading notifications...
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      loadNotificationsList();
    });

    async function loadNotificationsList() {
      try {
        const data = await apiFetch('/api/notifications');
        if (!data) return;

        const box = document.getElementById('notifications-list-box');
        if (!data.notifications || data.notifications.length === 0) {
          box.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted);">No notifications in your inbox.</div>`;
          return;
        }

        box.innerHTML = data.notifications.map(n => `
          <div class="notif-item ${n.read_status === 0 ? 'unread' : ''}">
            <div>
              <div style="font-weight:700; font-size:0.95rem; margin-bottom:0.25rem; color:var(--text-main);">${n.title}</div>
              <div style="font-size:0.85rem; color:var(--text-muted);">${n.message}</div>
              <div style="font-size:0.75rem; color:var(--text-subtle); margin-top:0.4rem;">${formatDate(n.created_at)}</div>
            </div>
            ${n.read_status === 0 ? `<button class="btn btn-secondary" style="padding:0.3rem 0.6rem; font-size:0.72rem;" onclick="markSingleRead(${n.id})">Mark Read</button>` : `<span style="font-size:0.75rem; color:var(--status-good);">Read</span>`}
          </div>
        `).join('');

      } catch (err) {
        console.error('Error loading notifications:', err);
      }
    }

    async function markSingleRead(id) {
      await apiFetch(`/api/notifications/${id}/read`, { method: 'PUT' });
      loadNotificationsList();
    }

    async function markAllNotificationsRead() {
      await apiFetch('/api/notifications/read_all', { method: 'PUT' });
      showToast('All notifications marked as read', 'success');
      loadNotificationsList();
    }
  </script>
</body>
</html>
